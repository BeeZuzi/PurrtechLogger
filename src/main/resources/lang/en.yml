# PurrTechDetailLogger - English. Chosen in config.yml (language: en). Server-wide: every player sees
# this language, whatever their own client language is.
# {0}, {1}, ... = values filled in by the plugin. A missing key falls back to the default copy of this file.
# Colours: & codes do not work, menus accept § codes (e.g. §7).

common:
  'on': ON
  'off': 'OFF'
  online: ONLINE
  offline: OFFLINE
  lookup-failed: Lookup failed, see the console.
  unknown-item: "No item with UUID '{0}' is known."

tracking:
  enabled: Tracking ON. Previously tracked items will get new UUIDs.
  stripping: "Removing tags: players done ({0} pcs), {1} loaded chunks will be processed in batches..."
  stripped: "Done: removed {0} tags. The units are retired in the DB. Offline players and unloaded chunks are cleaned once they load."

time:
  ago-seconds: "{0} s ago"
  ago-minutes: "{0} min ago"
  ago-hours: "{0} h ago"
  ago-days: "{0} days ago"

category:
  GENESIS: Created
  PLACED: Placed
  MOVED: Moved
  MERGED: Merged
  SEEN: Seen
  SPAWNED: Spawned
  DROPPED: Dropped
  PICKED_UP: Picked up
  DESTROYED: Destroyed
  CREATIVE_DUPLICATE: Dupe
  VIEWED_IN_MENU: In menu
  SHULKER_OPENED: Shulker
  VANISHED_BY_COMMAND: Gone (cmd)
  REAPPEARED_AFTER_COMMAND: Back (cmd)
  MOVED_BY_COMMAND: Moved (cmd)

calendar:
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  weekdays: [MO, TU, WE, TH, FR, SA, SU]

cmd:
  help:
    - "=== PurrTechDetailLogger ==="
    - "/purrlog gui - open the admin GUI (needs DisplayGUI)"
    - "/purrlog history <uuid> - history of a tracked unit"
    - "/purrlog alerts - unresolved dupe alerts"
    - "/purrlog players - every player who ever joined"
    - "/purrlog player <name|uuid> - profile and UUID of one player"
    - "/purrlog sweep - run the reconciliation sweep now"
    - "/purrlog tracking off|on|status - kill switch: strips the tags from every item and stops tracking"
    - "/purrlog mint <player> - tags every untagged template item in their inventory"
    - "/purrlog issue <player> <template> <amount> [reason] - report a ledger item hand-out (crate/shop)"
    - "/purrlog ledger [template] - who holds how much of a ledger item"
    - "/purrlog reference [done] - the held item becomes a reference (crate master), copies get new UUIDs"
    - "/purrlog reload - reloads config, language and templates.yml"
    - "/purrlog template import <key> - creates a template from the held item (the item itself is stored too)"
    - "/purrlog template item <key> - the held item becomes the stored item of an existing template"
    - "/purrlog give <player> <template> [amount] - gives the template's item (the original one it was made from)"
    - "/purrlog debug on|off|dump|clear - trace clicks/drags into debug.log; /purrlog debug stats - DB write queue state"
    - "/purrlog dbtest - checks the DB pipeline by writing and reading a test record"
  players-only: Only a player can use this command.
  player-offline: "Player '{0}' is not online."
  tracking-off-first: Tracking is off - run /purrlog tracking on first.
  sweep-started: Reconciliation sweep started.
  issue:
    not-ledger: "Template '{0}' does not exist or has no mode: ledger. Ledger templates: {1}"
    bad-amount: The amount must be a positive whole number.
  reference:
    done: Reference item setup finished - copies are tagged with new UUIDs from now on.
    players-only: Players only (hold the item).
    hold-one: "Hold EXACTLY 1 item that matches a template (not mode: ledger)."
    created: "Reference item: {0}. Put it into the crate (the item in your hand), then type /purrlog reference done (ends by itself after 10 min)."
  ledger:
    list: "Ledger templates: {0} - /purrlog ledger <template>"
    not-ledger: "Template '{0}' is not in mode: ledger."
    header: "=== {0} - online players (inventory, no ender chest) ==="
    nobody: (nobody is holding it)
  mint:
    done: "{0}: tagged {1} pcs (new units)."
  queue:
    header: "=== DB write queue ==="
    pending: "Waiting now: {0} (events/locations {1} of {2} = {3} %)"
    peak: "Most at once since start: {0}"
    dropped: "Dropped since start: {0}"
    written: "Written since start: {0} (average {1}/s over the whole uptime)"
    speed: "Raw write speed: {0}/s (while the writer works) - last batch {1} in {2} ms"
    busy: "The writer was busy {0} % of the time."
  tracking:
    already-off: Tracking is already off.
    already-on: Tracking is already running.
    status: "Item tracking: {0} (/purrlog tracking off|on)"
  debug:
    'on': "Debug ON - writing to {0}. Do what misbehaves, then /purrlog debug off and send me that file."
    'off': "Debug off. File: {0}"
    dumped: The open inventory was written to debug.log.
    cleared: debug.log deleted.
    clear-failed: Could not delete debug.log.
    status: "Debug is {0}. /purrlog debug on|off|dump|stats|clear"
  players:
    none: Nobody has joined yet.
    header: "Players ({0}/{1}):"
    line: " - [{0}] {1} uuid={2}"
  player:
    none: "No player matches '{0}'."
    state: "State: {0}, first joined {1}"
  gui:
    no-displaygui: DisplayGUI is not installed/enabled - the admin GUI is not available.
  alerts:
    none: No unresolved dupe alerts.
    header: "Unresolved alerts ({0}):"
    line: " - [{0}] {1} uuid={2} observed={3} expected={4} player={5}{6} {7}"
  history:
    unit: "template id={0} kind={1} origin={2} alive={3}"
    destroyed: "destroyed: {0} at {1}"
    header: "history ({0}):"
  reload:
    loading: Reloading config, language and templates...
    done: "Done: {0} templates loaded."
    failed: Reload failed, see the console.
  template:
    players-only: Only a player can run this (holding the item that should become a template).
    empty-hand: You are not holding anything.
    exists: "A template with key '{0}' already exists."
    save-failed: "Saving templates.yml failed: {0}"
    added: "Template '{0}' added (material={1}). Reloading..."
    unknown: "There is no template '{0}'."
    item-set: "The held item ({1}) is now the stored item of template '{0}'. Reloading..."
  give:
    unknown-template: "There is no template '{0}'. Templates: {1}"
    bad-amount: "The amount must be a whole number from 1 to {0}."
    mismatch: "Warning: the item does not match template '{0}' on its own (another template wins, or the matching was changed after the item was stored) - it will not be tagged."
    done: "Gave {0}x '{1}' to {2}."
    dropped: "{0} pcs did not fit and were dropped at their feet."
    approximate: "Template '{0}' has no stored item, so this is only a plain item rebuilt from its material/model data. Hold the real one and run /purrlog template item {0}."
  dbtest:
    written: "Wrote test UUID {0}, reading it back..."
    unit-ok: "tracked_units: OK (origin={0}, alive={1})"
    unit-missing: "tracked_units: MISSING - the write did not go through"
    events: "events: {0} record(s)"

