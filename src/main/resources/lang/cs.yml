# PurrTechDetailLogger - cestina. Vybira se v config.yml (language: cs). Plati pro cely server,
# vsichni hraci vidi tento jazyk bez ohledu na jazyk sveho klienta.
# {0}, {1}, ... = hodnoty doplnene pluginem. Chybejici klic se doplni z vychozi verze tohoto souboru.
# Barvy: & kody nefunguji, v menu jde pouzit §-kod (napr. §7).

common:
  'on': ZAPNUTO
  'off': VYPNUTO
  online: ONLINE
  offline: OFFLINE
  lookup-failed: Lookup selhal, viz konzole.
  unknown-item: "Item s UUID '{0}' neni znam."

tracking:
  enabled: Sledovani ZAPNUTO. Drive sledovane predmety dostanou nove UUID.
  stripping: "Odebiram znacky: hraci hotovi ({0} ks), {1} nactenych chunku se zpracuje po davkach..."
  stripped: "Hotovo: odebrano {0} znacek. Jednotky v DB jsou vyrazene. Hraci offline a nenactene chunky se vycisti, az se nactou."

time:
  ago-seconds: pred {0} s
  ago-minutes: pred {0} min
  ago-hours: pred {0} h
  ago-days: pred {0} dny

category:
  GENESIS: Vznik
  PLACED: Polozeno
  MOVED: Presun
  MERGED: Slouceno
  SEEN: Spatreno
  SPAWNED: Spawnuto
  DROPPED: Vyhozeno
  PICKED_UP: Sebrano
  DESTROYED: Znicen
  CREATIVE_DUPLICATE: Dupe
  VIEWED_IN_MENU: V menu
  SHULKER_OPENED: Shulker
  VANISHED_BY_COMMAND: Zmizel cmd
  REAPPEARED_AFTER_COMMAND: Zpet po cmd
  MOVED_BY_COMMAND: Presun cmd

calendar:
  months: [Leden, Unor, Brezen, Duben, Kveten, Cerven, Cervenec, Srpen, Zari, Rijen, Listopad, Prosinec]
  weekdays: [PO, UT, ST, CT, PA, SO, NE]

cmd:
  help:
    - "=== PurrTechDetailLogger ==="
    - "/purrlog gui - otevri admin GUI (vyzaduje DisplayGUI)"
    - "/purrlog history <uuid> - historie sledovane jednotky"
    - "/purrlog alerts - nevyresene dupe alerty"
    - "/purrlog players - seznam vsech hracu, co se kdy pripojili"
    - "/purrlog player <nick|uuid> - profil a UUID konkretniho hrace"
    - "/purrlog sweep - rucne spusti reconciliation sweep"
    - "/purrlog tracking off|on|status - nouzovy vypinac: odebere vsem predmetum znacky a vypne sledovani"
    - "/purrlog mint <hrac> - oznaci vsechny neoznacene sablonove itemy v jeho inventari"
    - "/purrlog issue <hrac> <sablona> <pocet> [duvod] - hlaseni vydani ledger itemu (crate/obchod)"
    - "/purrlog ledger [sablona] - kdo kolik drzi ledger itemu"
    - "/purrlog reference [done] - drzeny item se stane referencnim (vzor pro crate), kopie dostanou nova UUID"
    - "/purrlog reload - znovu nacte config, jazyk a templates.yml"
    - "/purrlog template import <klic> - vytvori sablonu z drzeneho itemu (ulozi se i samotny item)"
    - "/purrlog template item <klic> - drzeny item se stane ulozenym itemem existujici sablony"
    - "/purrlog give <hrac> <sablona> [pocet] - da item ze sablony (ten puvodni, ze ktereho vznikla)"
    - "/purrlog debug on|off|dump|clear - trace klikani/dragu do debug.log; /purrlog debug stats - stav fronty zapisu do DB"
    - "/purrlog dbtest - overi DB potrubi zapisem/ctenim testovaciho zaznamu"
  players-only: Tento prikaz muze pouzit jen hrac.
  player-offline: "Hrac '{0}' neni online."
  tracking-off-first: Sledovani je vypnute - nejdriv /purrlog tracking on.
  sweep-started: Reconciliation sweep spusten.
  issue:
    not-ledger: "Sablona '{0}' neexistuje nebo nema mode: ledger. Ledger sablony: {1}"
    bad-amount: Pocet musi byt kladne cele cislo.
  reference:
    done: Nastaveni referencniho itemu ukonceno - kopie se od ted oznacuji novymi UUID.
    players-only: Jen pro hrace (drz item v ruce).
    hold-one: "Drz v ruce PRESNE 1 kus itemu, ktery odpovida sablone (bez mode: ledger)."
    created: "Referencni item: {0}. Uloz ho do crate (ten item v ruce), pak napis /purrlog reference done (jinak se sam ukonci za 10 min)."
  ledger:
    list: "Ledger sablony: {0} - /purrlog ledger <sablona>"
    not-ledger: "Sablona '{0}' neni v mode: ledger."
    header: "=== {0} - online hraci (inventar, bez ender chestu) ==="
    nobody: (nikdo to u sebe nema)
  mint:
    done: "{0}: oznaceno {1} ks (nove jednotky)."
  queue:
    header: "=== Fronta zapisu do DB ==="
    pending: "Ceka ted: {0} (z toho udalosti/polohy {1} z {2} = {3} %)"
    peak: "Nejvic naraz od startu: {0}"
    dropped: "Zahozeno od startu: {0}"
    written: "Zapsano od startu: {0} (prumer {1}/s behem celeho provozu)"
    speed: "Rychlost samotneho zapisu: {0}/s (kdyz zapisovac pracuje) - posledni davka {1} za {2} ms"
    busy: "Zapisovac pracoval {0} % casu."
  tracking:
    already-off: Sledovani uz je vypnute.
    already-on: Sledovani uz bezi.
    status: "Sledovani predmetu: {0} (/purrlog tracking off|on)"
  debug:
    'on': "Debug ZAPNUT - zapisuje se do {0}. Udelej to, co zlobi, pak /purrlog debug off a posli mi ten soubor."
    'off': "Debug vypnut. Soubor: {0}"
    dumped: Obsah otevreneho inventare zapsan do debug.log.
    cleared: debug.log smazan.
    clear-failed: debug.log se nepodarilo smazat.
    status: "Debug je {0}. /purrlog debug on|off|dump|stats|clear"
  players:
    none: Zatim se nikdo nepripojil.
    header: "Hraci ({0}/{1}):"
    line: " - [{0}] {1} uuid={2}"
  player:
    none: "Zadny hrac neodpovida '{0}'."
    state: "Stav: {0}, prvni pripojeni {1}"
  gui:
    no-displaygui: DisplayGUI neni nainstalovane/aktivni - admin GUI neni k dispozici.
  alerts:
    none: Zadne nevyresene dupe alerty.
    header: "Nevyresene alerty ({0}):"
    line: " - [{0}] {1} uuid={2} nalezeno={3} ocekavano={4} hrac={5}{6} {7}"
