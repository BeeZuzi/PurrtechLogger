    header: "historie ({0}):"
  reload:
    loading: Nacitam config, jazyk a sablony...
    done: "Hotovo: {0} sablon nacteno."
    failed: Reload selhal, viz konzole.
  template:
    players-only: Tento prikaz musi spustit hrac (drzi item v ruce, ktery se ma stat sablonou).
    empty-hand: V ruce nic nedrzis.
    exists: "Sablona s klicem '{0}' uz existuje."
    save-failed: "Ulozeni templates.yml selhalo: {0}"
    added: "Sablona '{0}' pridana (material={1}). Spoustim reload..."
    unknown: "Sablona '{0}' neexistuje."
    item-set: "Drzeny item ({1}) je ted ulozeny item sablony '{0}'. Spoustim reload..."
  give:
    unknown-template: "Sablona '{0}' neexistuje. Sablony: {1}"
    bad-amount: "Pocet musi byt cele cislo od 1 do {0}."
    mismatch: "Pozor: item sam o sobe sablone '{0}' neodpovida (vyhrava jina sablona, nebo se po ulozeni zmenilo prirazovani) - nebude oznacen."
    done: "Dano {0}x '{1}' hraci {2}."
    dropped: "{0} ks se nevesly a spadly hraci k noham."
    approximate: "Sablona '{0}' nema ulozeny item, takze je to jen obycejny item slozeny z materialu/model dat. Drz ten pravy a pust /purrlog template item {0}."
